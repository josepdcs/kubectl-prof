apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: prof
spec:
  homepage: https://github.com/josepdcs/kubectl-prof
  shortDescription: Generate CPU profiling graphs and other several outputs as JFR and heap dumps (Java), thread dumps (Java, Python), etc. from pods (Containerd, Cri-o are supported). This is a fork of flame plugin.
  version: "v2.3.0"
  description: |
    Generate CPU profiling graphs and other several outputs as JFR and heap dumps (Java), thread dumps (Java, Python), etc. without restarting pods and with low overhead. Containerd and Cri-o are supported. 
    This is an open source fork of https://github.com/yahoo/kubectl-flame with several new features and bug fixes.
  caveats: |
    Currently supported languages: Go, Java (any JVM based language), Rust, DotNet, Python, Ruby, NodeJS, Clang and Clang++.
  platforms:
    - uri: https://github.com/josepdcs/kubectl-prof/releases/download/2.3.0/kubectl-prof_2.3.0_darwin_amd64.tar.gz
      sha256: 64e48ba3e8bc88cc16bef5ecf9ecc62af81808cca63f6b2481bb59d0139689bf
      bin: kubectl-prof
      files:
        - from: kubectl-prof
          to: .
        - from: LICENSE
          to: .
      selector:
        matchLabels:
          os: darwin
          arch: amd64
    - uri: https://github.com/josepdcs/kubectl-prof/releases/download/2.3.0/kubectl-prof_2.3.0_darwin_arm64.tar.gz
      sha256: a18b41a1d3c4a33d7bcf03e0373ed8efe6b8062a4db689fffc94b57b84b537db
      bin: kubectl-prof
      files:
        - from: kubectl-prof
          to: .
        - from: LICENSE
          to: .
      selector:
        matchLabels:
          os: darwin
          arch: arm64
    - uri: https://github.com/josepdcs/kubectl-prof/releases/download/2.3.0/kubectl-prof_2.3.0_linux_amd64.tar.gz
      sha256: a719a58a3b871773de8071f2ed9b9f3dddb970f80d73fe7439feb3603a69d399
      bin: kubectl-prof
      files:
        - from: kubectl-prof
          to: .
        - from: LICENSE
          to: .
      selector:
        matchLabels:
          os: linux
          arch: amd64
    - uri: https://github.com/josepdcs/kubectl-prof/releases/download/2.3.0/kubectl-prof_2.3.0_linux_arm64.tar.gz
      sha256: 4b82189390668534af97d2c470fbd24b1196438ac99610b0893b479466a2c6ec
      bin: kubectl-prof
      files:
        - from: kubectl-prof
          to: .
        - from: LICENSE
          to: .
      selector:
        matchLabels:
          os: linux
          arch: arm64
    - uri: https://github.com/josepdcs/kubectl-prof/releases/download/2.3.0/kubectl-prof_2.3.0_windows_amd64.zip
      sha256: 716fb0611bf4c4ba02b74424b5059885132eaf7e91e5b69eb754f65e09bacd0d
      bin: kubectl-prof.exe
      files:
        - from: kubectl-prof.exe
          to: .
        - from: LICENSE
          to: .
      selector:
        matchLabels:
          os: windows
          arch: amd64
    - uri: https://github.com/josepdcs/kubectl-prof/releases/download/2.3.0/kubectl-prof_2.3.0_windows_arm64.zip
      sha256: 0389248d59b48aa831ee7e1180296463154b0d4206fcd7bf01817dca6c993c7e
      bin: kubectl-prof.exe
      files:
        - from: kubectl-prof.exe
